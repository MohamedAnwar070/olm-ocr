apiVersion: v1
kind: Service
metadata:
  name: olmocr-api-service
  namespace: ocr-system
spec:
  selector:
    app: olmocr-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster
